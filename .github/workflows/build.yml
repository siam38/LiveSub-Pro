name: Build LiveSub Pro APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish this build as a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Placeholder google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "livesub-local",
              "storage_bucket": "livesub-local.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.charles.livecaptionn" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "local-placeholder" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Local properties (ads off)
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          translate.url=http://localhost:3006
          stt.url=http://localhost:9000/asr?output=json
          ads.enabled=false
          EOF

      - name: Fetch sherpa-onnx runtime AAR
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar"
          ls -la app/libs/

      - name: Fetch gradle wrapper jar from upstream
        run: curl -sL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/chartmann1590/LiveTranscribe-Android/main/gradle/wrapper/gradle-wrapper.jar"

      - name: Fetch bundled tutorial video from upstream
        run: |
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 -o app/src/main/res/raw/tutorial_video.mp4 "https://raw.githubusercontent.com/chartmann1590/LiveTranscribe-Android/main/app/src/main/res/raw/tutorial_video.mp4"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-run-${{ github.run_number }}
          path: |
            app/build/reports/tests/testGithubDebugUnitTest/
            app/build/test-results/testGithubDebugUnitTest/

      - name: Build debug APK
        run: ./gradlew assembleGithubDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/github/debug/app-github-debug.apk LiveSub-Pro-v1.0.${{ github.run_number }}.apk
          ls -la LiveSub-Pro-v1.0.${{ github.run_number }}.apk

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: LiveSub-Pro-v1.0.${{ github.run_number }}
          path: LiveSub-Pro-v1.0.${{ github.run_number }}.apk
          compression-level: 0

      # Test builds only: a Release is published solely on a manual run
      # with the "release" input ticked, after the build is tested OK.
      - name: Publish APK to a GitHub Release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LiveSub Pro v1.0.${{ github.run_number }}
          files: LiveSub-Pro-v1.0.${{ github.run_number }}.apk
