name: Build LiveSub Pro APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Placeholder google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "livesub-local",
              "storage_bucket": "livesub-local.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.charles.livecaptionn" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "local-placeholder" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Local properties (ads off)
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          translate.url=http://localhost:3006
          stt.url=http://localhost:9000/asr?output=json
          ads.enabled=false
          EOF

      - name: Bundle Vosk speech models (Chinese + English)
        run: |
          mkdir -p app/src/main/assets/models /tmp/vosk
          curl -sL -o /tmp/vosk/zh.zip "https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip"
          curl -sL -o /tmp/vosk/en.zip "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
          unzip -q -o /tmp/vosk/zh.zip -d app/src/main/assets/models/
          unzip -q -o /tmp/vosk/en.zip -d app/src/main/assets/models/
          ls app/src/main/assets/models/

      - name: Fetch gradle wrapper jar from upstream
        run: curl -sL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/chartmann1590/LiveTranscribe-Android/main/gradle/wrapper/gradle-wrapper.jar"

      - name: Fetch bundled tutorial video from upstream
        run: curl -sL -o app/src/main/res/raw/tutorial_video.mp4 "https://raw.githubusercontent.com/chartmann1590/LiveTranscribe-Android/main/app/src/main/res/raw/tutorial_video.mp4"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleGithubDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/github/debug/app-github-debug.apk LiveSub-Pro.apk
          ls -la LiveSub-Pro.apk

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LiveSub Pro v1.0.${{ github.run_number }}
          files: LiveSub-Pro.apk
